name: C++ build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MPI and crypt development libraries
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev libcrypt-dev

      - name: Compile
        run: make

      - name: Check whitespace
        run: git diff --check
